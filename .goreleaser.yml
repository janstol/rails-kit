version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/janstol/rails-kit/internal/version.Version={{.Version}}
      - -X github.com/janstol/rails-kit/internal/version.Commit={{.Commit}}
      - -X github.com/janstol/rails-kit/internal/version.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  algorithm: sha256

release:
  name_template: "v{{.Version}}"

homebrew_casks:
  - repository:
      owner: janstol
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/janstol/rails-kit
    description: CLI toolkit for exploring Rails codebases without loading Rails
    binaries:
      - rails-kit
    url:
      verified: github.com/janstol/rails-kit/
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rails-kit"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
