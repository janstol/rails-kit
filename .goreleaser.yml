version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/janstol/rails-kit/internal/version.Version={{.Version}}
      - -X github.com/janstol/rails-kit/internal/version.Commit={{.Commit}}
      - -X github.com/janstol/rails-kit/internal/version.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  algorithm: sha256

release:
  name_template: "v{{.Version}}"

homebrew_casks:
  - repository:
      owner: janstol
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/janstol/rails-kit
    description: CLI toolkit for exploring Rails codebases without loading Rails
    binaries:
      - rails-kit
    url:
      template: "https://github.com/janstol/rails-kit/releases/download/v#{version}/{{ .ArtifactName }}"
    # GoReleaser's cask template only emits the deprecated `postflight` stanza
    # for hooks.post.install, so the quarantine step goes through custom_block
    # instead. The token is escaped because GoReleaser templates the rendered
    # cask; Homebrew expands {{staged_path}} at install time. custom_block lands
    # at the top of the cask -- the normalize-cask release job moves it into
    # stanza order.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/rails-kit"]
        end
      end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
