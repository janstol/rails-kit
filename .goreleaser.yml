version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/janstol/rails-kit/internal/version.Version={{.Version}}
      - -X github.com/janstol/rails-kit/internal/version.Commit={{.Commit}}
      - -X github.com/janstol/rails-kit/internal/version.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksums:
  algorithm: sha256

release:
  name_template: "v{{.Version}}"

brews:
  - repository:
      owner: janstol
      name: homebrew-tap
    homepage: https://github.com/janstol/rails-kit
    description: Fast CLI toolkit for exploring Rails codebases — schema, routes, models, fixtures, locales
    install: bin.install "rails-kit"
    test: |
      system "#{bin}/rails-kit", "version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
