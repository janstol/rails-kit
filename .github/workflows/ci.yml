name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Benchmark smoke test
        if: matrix.os == 'ubuntu-latest'
        run: go test -bench=. -benchtime=1x -run=^$ ./...

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  startup-budget:
    name: Startup budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o "$RUNNER_TEMP/rails-kit" .

      # Advisory on purpose: the absolute ceilings in cmd/startup_test.go are
      # sized for an M1 Pro and have never been measured on a shared runner.
      # The step logs median and delta-over-floor for every case; once those
      # numbers are known, drop continue-on-error to make this a real gate.
      - name: Startup budget
        continue-on-error: true
        env:
          RAILS_KIT_BENCH_BIN: ${{ runner.temp }}/rails-kit
        run: go test ./cmd/ -run TestStartupBudget -v -count=1
