name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    # Explicit name so the required-status-check context stays stable across
    # Go bumps -- the default matrix name embeds the Go version, which silently
    # broke branch protection when the matrix moved 1.26.x -> 1.27.x.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      # Guards against a colored test that forgets t.Setenv("NO_COLOR", ""):
      # runners never set NO_COLOR, so such a test passes CI and fails only
      # on a developer machine that has it exported.
      - name: Test with NO_COLOR set
        if: matrix.os == 'ubuntu-latest'
        env:
          NO_COLOR: "1"
        run: go test ./...

      - name: Benchmark smoke test
        if: matrix.os == 'ubuntu-latest'
        run: go test -bench=. -benchtime=1x -run=^$ ./...

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  startup-budget:
    name: Startup budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o "$RUNNER_TEMP/rails-kit" .

      # Gate: the ceilings in cmd/startup_test.go were sized for an M1 Pro
      # and are now validated against four ubuntu-latest runs (see
      # BACKLOG.local.md, Performance) with 2.2x-7.6x headroom on every case.
      # The step logs median and delta-over-floor for every case, so a drift
      # toward the ceiling shows up in the numbers before it trips the gate.
      - name: Startup budget
        env:
          RAILS_KIT_BENCH_BIN: ${{ runner.temp }}/rails-kit
        run: go test ./cmd/ -run TestStartupBudget -v -count=1
