name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # goreleaser's homebrew_casks template emits style-dirty Ruby (on_intel
  # before on_arm, stray blank lines) that `brew test-bot` rejects. Re-normalize
  # the generated cask with Homebrew's own linter and push the fix to the tap.
  # No-op (and skipped) when goreleaser's output is already clean.
  # This also relocates the postflight_steps stanza injected via custom_block
  # (goreleaser has no native postflight_steps support, so .goreleaser.yml
  # emits it at the top of the cask, before `version`) into correct stanza
  # order, after `binary`. Without this job that stanza would sit in the wrong
  # place and fail `brew style`.
  normalize-cask:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: janstol/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Checkout must happen before setup-homebrew. Both actions configure GitHub
      # authentication; the reverse order sends duplicate Authorization headers
      # on the checkout's own fetch.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize cask style
        working-directory: tap
        run: brew style --fix Casks/rails-kit.rb

      # setup-homebrew's `token` input installs a *global* git credential
      # header (git config --global "http.https://github.com/.extraheader")
      # that outlives its own step. actions/checkout's tap credential is
      # scoped via a repo-local includeIf, so once both are present any git
      # command below sends two Authorization headers and GitHub rejects the
      # request with "Duplicate header: Authorization" (400). Drop the global
      # one now that Homebrew's own GitHub calls in the previous step are
      # done, so the push below is left with only the tap-scoped credential.
      - name: Remove global git credential set by setup-homebrew
        run: git config --global --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" || true

      - name: Commit and push if changed
        working-directory: tap
        run: |
          if git diff --quiet -- Casks/rails-kit.rb; then
            echo "No style changes needed; cask is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rails-kit.rb
          git commit -m "Normalize cask style for ${{ github.ref_name }} (brew style --fix)"
          git push origin HEAD:main
