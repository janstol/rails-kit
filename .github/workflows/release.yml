name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Tags are normally cut from a green main, but nothing enforces that, so
  # gate publishing on the tests passing at the tagged commit itself. The full
  # OS matrix runs in ci.yml; one OS is enough to stop a broken tag.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Pinned so a goreleaser release can't change our output between two
      # tags without a commit here. Bump deliberately and run
      # `goreleaser release --snapshot --clean --skip=publish` locally first.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # goreleaser's homebrew_casks template emits style-dirty Ruby (on_intel
  # before on_arm, stray blank lines) that `brew test-bot` rejects. Re-normalize
  # the generated cask with Homebrew's own linter and push the fix to the tap.
  # No-op (and skipped) when goreleaser's output is already clean.
  # This also relocates the postflight_steps stanza injected via custom_block
  # (goreleaser has no native postflight_steps support, so .goreleaser.yml
  # emits it at the top of the cask, before `version`) into correct stanza
  # order, after `binary`. Without this job that stanza would sit in the wrong
  # place and fail `brew style`.
  normalize-cask:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: janstol/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Checkout must happen before setup-homebrew. Both actions configure GitHub
      # authentication; the reverse order sends duplicate Authorization headers
      # on the checkout's own fetch.
      # Pinned to a commit: Homebrew/actions has no releases, and the push
      # step below depends on how this action sets its credential (globally,
      # `git config --global http.<server>/.extraheader`). Recheck that in
      # setup-homebrew/main.sh before moving the pin.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # main as of 2026-10-30
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize cask style
        working-directory: tap
        run: brew style --fix Casks/rails-kit.rb

      # setup-homebrew's `token` input installs a *global* git credential
      # header (git config --global "http.https://github.com/.extraheader")
      # that outlives its own step. actions/checkout's tap credential is
      # scoped via a repo-local includeIf, so with both present git sends two
      # Authorization headers and GitHub rejects the push with "Duplicate
      # header: Authorization" (400). GIT_CONFIG_GLOBAL=/dev/null makes this
      # step ignore the global config, leaving only the tap credential. Don't
      # unset the global header instead: setup-homebrew's post step unsets it
      # itself under `set -e`, and `git config --unset-all` exits 5 when the
      # key is already gone, which failed the v0.7.0 run after a good push.
      - name: Commit and push if changed
        working-directory: tap
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          if git diff --quiet -- Casks/rails-kit.rb; then
            echo "No style changes needed; cask is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rails-kit.rb
          git commit -m "Normalize cask style for ${{ github.ref_name }} (brew style --fix)"
          git push origin HEAD:main
